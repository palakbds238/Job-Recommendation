{% extends "base.html" %}
{% block title %}Forgot password — CareerAI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🔑</div>
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a link to choose a new one.</p>
    </div>
    <form method="POST" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="fp-email">Email address</label>
        <input id="fp-email" type="email" name="email" required placeholder="you@example.com" autocomplete="email" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
    </form>
    <div class="auth-footer"><p><a href="{{ url_for('login') }}">← Back to sign in</a></p></div>
  </div>
</div>
{% endblock %}
